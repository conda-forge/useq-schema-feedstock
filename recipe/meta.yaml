{% set name = "useq-schema" %}
{% set version = "0.9.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/useq_schema-{{ version }}.tar.gz
  sha256: a84a374f734c0441c63ecb463d150dae4449e215347bfd990c8c13711184bbf1

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}.*
    - hatchling
    - hatch-vcs
  run:
    - numpy >=1.25.2
    - pydantic >=2.10
    - python >={{ python_min }}
    - typing-extensions >=4
    - shapely >=2.0.7

test:
  imports:
    - useq
  commands:
    - pip list
    - pip check
  requires:
    - pip
    - python {{ python_min }}.*

about:
  home: https://pypi.org/project/useq-schema
  summary: Schema for multi-dimensional microscopy experiments
  dev_url: https://github.com/pymmcore-plus/useq-schema
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - goanpeca
    - tlambert03
